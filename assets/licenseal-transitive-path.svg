<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
  <title id="title">A warning three steps down the dependency tree</title>
  <desc id="desc">Illustrative packages: an Apache-2.0 project depends on client and logging, both MIT. Client depends on transport, also MIT, which depends on certs under MPL-2.0. Amber arrows trace the path to certs, the only warning. Unreviewed warnings fail the default strict check.</desc>
  <defs>
    <marker id="arrow-warning" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#ffd089" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#7890a5" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; }
      .heading { fill: #edf4fa; font-size: 30px; font-weight: 650; }
      .muted { fill: #a8bac9; font-size: 17px; }
      .label { fill: #a8bac9; font-size: 13px; font-weight: 600; letter-spacing: 1.5px; }
      .name { fill: #edf4fa; font-size: 22px; font-weight: 650; }
      .license { fill: #c4d3df; font-size: 17px; }
      .ok { fill: #62decb; font-size: 15px; font-weight: 600; }
      .warning { fill: #ffd089; font-size: 15px; font-weight: 600; }
    </style>
  </defs>
  <rect x="1" y="1" width="958" height="558" rx="18" fill="#0d1721" stroke="#293e50"/>
  <text x="40" y="53" class="heading">The warning can be three steps away.</text>
  <text x="40" y="84" class="muted">Check the dependencies your dependencies bring in.</text>

  <text x="40" y="128" class="label">YOUR PROJECT</text>
  <text x="272" y="128" class="label">DIRECT</text>
  <text x="504" y="128" class="label">TRANSITIVE</text>
  <text x="736" y="128" class="label">TRANSITIVE</text>

  <path d="M 224 209 H 261" fill="none" stroke="#ffd089" stroke-width="2.5" marker-end="url(#arrow-warning)"/>
  <path d="M 456 209 H 493" fill="none" stroke="#ffd089" stroke-width="2.5" marker-end="url(#arrow-warning)"/>
  <path d="M 688 209 H 725" fill="none" stroke="#ffd089" stroke-width="2.5" marker-end="url(#arrow-warning)"/>
  <path d="M 132 252 V 333 Q 132 349 148 349 H 261" fill="none" stroke="#7890a5" stroke-width="2" marker-end="url(#arrow-muted)"/>

  <rect x="40" y="148" width="184" height="104" rx="12" fill="#142c35" stroke="#3d8f8c"/>
  <text x="60" y="185" class="name">Your app</text>
  <text x="60" y="215" class="license">Apache-2.0</text>

  <rect x="272" y="148" width="184" height="122" rx="12" fill="#162432" stroke="#344b5e"/>
  <text x="292" y="185" class="name">client</text>
  <text x="292" y="213" class="license">MIT</text>
  <text x="292" y="247" class="ok">✓ Compatible</text>

  <rect x="504" y="148" width="184" height="122" rx="12" fill="#162432" stroke="#344b5e"/>
  <text x="524" y="185" class="name">transport</text>
  <text x="524" y="213" class="license">MIT</text>
  <text x="524" y="247" class="ok">✓ Compatible</text>

  <rect x="736" y="148" width="184" height="122" rx="12" fill="#30291f" stroke="#ffd089" stroke-width="2"/>
  <text x="756" y="185" class="name">certs</text>
  <text x="756" y="213" class="license">MPL-2.0</text>
  <text x="756" y="247" class="warning">⚠ Warning</text>

  <rect x="272" y="294" width="184" height="110" rx="12" fill="#162432" stroke="#344b5e"/>
  <text x="292" y="327" class="name">logging</text>
  <text x="292" y="355" class="license">MIT</text>
  <text x="292" y="385" class="ok">✓ Compatible</text>

  <path d="M 516 325 H 551" fill="none" stroke="#ffd089" stroke-width="2.5" marker-end="url(#arrow-warning)"/>
  <text x="568" y="331" class="muted">Path to the flagged dependency</text>
  <text x="516" y="365" class="muted">Illustrative packages; verdicts are checked</text>
  <text x="516" y="390" class="muted">against the Apache-2.0 project license.</text>

  <rect x="40" y="436" width="880" height="88" rx="12" fill="#1d2833"/>
  <rect x="40" y="436" width="4" height="88" rx="2" fill="#ffd089"/>
  <text x="64" y="471" fill="#edf4fa" font-family="'Segoe UI', Arial, sans-serif" font-size="21" font-weight="650">Found through client. Flagged for review.</text>
  <text x="64" y="500" class="muted">Unreviewed warnings fail the default strict check.</text>
</svg>
