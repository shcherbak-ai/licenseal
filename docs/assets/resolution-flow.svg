<svg xmlns="http://www.w3.org/2000/svg" width="934" height="256" viewBox="0 0 934 256" role="img" aria-labelledby="title desc">
<title id="title">Lockfile-first resolution</title>
<desc id="desc">A manifest declares shared at version 2 or later. When a lockfile holds shared 2.4.0, it covers the declaration: the report shows the locked version, 2.4.0, and what it depends on. When there is no lockfile, no entry for shared, or an entry at 1.0.0, nothing covers the declaration: licenseal walks the registry and reports a version it picked there, marked as an estimate with a tilde, and the manifest is an analysis gap. With --no-require-lockfile the manifest is listed as an estimate and does not fail the check.</desc>
<style>
text{font-family:ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;font-size:13px;fill:#a1a1aa}
.step{font-size:12px;letter-spacing:1.6px;font-weight:600;fill:#fafafa}
.cap{font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;font-size:14px;fill:#e4e4e7}
.sub{font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;font-size:13px;fill:#a1a1aa}
.hi{fill:#fafafa}.dim{fill:#63636b}.caught{fill:#fbbf24}.foot{fill:#8b8b93;letter-spacing:.3px}
path,rect{fill:none;shape-rendering:crispEdges}
.rule{stroke:#2e2e33}
.mark{stroke:#a1a1aa;stroke-width:1.5;shape-rendering:geometricPrecision}
.miss{stroke:#fbbf24;stroke-width:1.5;shape-rendering:geometricPrecision}
.way{stroke:#63636b;stroke-width:1.5;shape-rendering:geometricPrecision}
</style>
<path d="M0.5 0.5H933.5V255.5H0.5Z" style="fill:#0c0c0e;stroke:#2e2e33"/>
<path class="rule" d="M214.5 0.5V208.5M560.5 0.5V208.5M214.5 124.5H933.5M0.5 208.5H933.5"/>

<!-- The way from the manifest to each case, and from each case to its row of the report. -->
<g>
<rect x="206.5" y="72.5" width="16" height="20" style="fill:#0c0c0e;stroke:none"/>
<rect x="206.5" y="156.5" width="16" height="20" style="fill:#0c0c0e;stroke:none"/>
<rect x="552.5" y="72.5" width="16" height="20" style="fill:#0c0c0e;stroke:none"/>
<rect x="552.5" y="156.5" width="16" height="20" style="fill:#0c0c0e;stroke:none"/>
<path class="way" d="M211.5 77.5l5 5l-5 5M211.5 161.5l5 5l-5 5M557.5 77.5l5 5l-5 5M557.5 161.5l5 5l-5 5"/>
</g>

<!-- Manifest -->
<text class="step" x="24" y="35">MANIFEST</text>
<text class="hi" x="24" y="87">shared>=2</text>
<text class="sub" x="24" y="112">a declared dependency</text>

<!-- Lockfile -->
<text class="step" x="238" y="35">LOCKFILE</text>
<text class="hi" x="238" y="79">shared 2.4.0</text>
<path class="mark" d="M352 75l3 3l6 -7"/>
<text class="sub" x="238" y="102">covers the declaration</text>

<text class="caught" x="238" y="163">no lockfile, no entry, or 1.0.0</text>
<path class="miss" d="M500 155l7 7M507 155l-7 7"/>
<text class="sub" x="238" y="186">does not cover it</text>

<!-- Report -->
<text class="step" x="584" y="35">REPORT</text>
<text class="hi" x="584" y="79">shared (2.4.0)</text>
<text class="sub" x="584" y="102">the locked version, and what it depends on</text>

<text class="caught" x="584" y="155">shared (~2.7.1)</text>
<text class="sub" x="584" y="178">picked from the registry: an estimate</text>
<text class="sub" x="584" y="197">the manifest is an analysis gap</text>

<text class="foot" x="467" y="237" text-anchor="middle">--no-require-lockfile: the manifest is listed as an estimate and does not fail</text>
</svg>
