<title id="title">licenseal report: one violation, found through a dependency</title>
<desc id="desc">Illustrative packages in an MIT project. The project requires client and parser. Client brings in transport and certs. Client, transport and parser are compatible. Certs uses GPL-3.0-only, a strong copyleft license, and is a violation. Summary: 1 violation, 3 ok. Typeset from the output of licenseal check: the command, the project license, the table and the summary.</desc>
