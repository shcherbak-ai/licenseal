repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml

  # These run from the project environment: uv.lock is their only version pin.
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --force-exclude --fix
        language: system
        types_or: [python, pyi, jupyter]
        require_serial: true
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --force-exclude
        language: system
        types_or: [python, pyi, jupyter, markdown]
        require_serial: true
      - id: bandit
        name: bandit
        entry: uv run bandit -c pyproject.toml
        language: system
        types: [python]
        require_serial: true
      - id: ty
        name: ty
        entry: uv run ty check src/
        language: system
        types: [python]
        pass_filenames: false
      - id: deptry
        name: deptry
        entry: uv run deptry .
        language: system
        types: [python]
        pass_filenames: false
      - id: uv-lock
        name: uv lock check
        entry: uv lock --check
        language: system
        pass_filenames: false
      - id: interrogate
        name: interrogate
        entry: uv run interrogate src/
        language: system
        types: [python]
        pass_filenames: false
      - id: vulture
        name: vulture
        entry: uv run vulture
        language: system
        types: [python]
        pass_filenames: false
      - id: validate-spdx-ids
        name: validate SPDX IDs against vendored canonical list
        entry: uv run python scripts/validate_spdx_ids.py
        language: system
        files: ^src/licenseal/analysis/(spdx|risk)\.py$|^src/licenseal/data/spdx-license-ids\.json$
        pass_filenames: false
      - id: commitizen
        name: commitizen check
        entry: uv run cz check --allow-abort --commit-msg-file
        language: system
        stages: [commit-msg]

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: 916ad0aaa108c64d294101002066f530ea170b10  # v0.23.3
    hooks:
      - id: markdownlint-cli2
