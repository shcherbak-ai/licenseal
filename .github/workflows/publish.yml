name: Publish

# Runs after each CI run on a branch named main, a pull request's from a fork
# whose branch has that name included, with the workflow and the context of
# the default branch (main). Nothing is checked out from the run or published
# unless the gate finds a v* tag of this repository on its commit and that
# commit on main, and the pypi environment accepts deployments from main
# only: that is why zizmor's dangerous-triggers finding is ignored on the
# trigger.
on:
  workflow_run:  # zizmor: ignore[dangerous-triggers]
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: publish-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: true

permissions:
  contents: read

# The SHA-256 of the Linux archive of that uv
# (uv-x86_64-unknown-linux-gnu.tar.gz.sha256 on its release page) changes with
# it: setup-uv holds the checksums of the uv releases before its own only, and
# checks a newer one against a list it fetches from uv's publisher at run
# time, which is not enough for the job that builds the release.
env:
  UV_VERSION: "0.13.5"
  UV_SHA256: "f68d291c75783122dad58ab77def0e13f3233f358731db5d6d7e8715603b928f"

jobs:
  publish-gate:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      should_publish: ${{ steps.check.outputs.should_publish }}
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Verify v* tag on main
        id: check
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          # Check for an actual v* tag pointing at this commit
          TAG=$(git tag --points-at "$SHA" | grep '^v' | head -n1)
          if [ -z "$TAG" ]; then
            echo "::notice::No v* tag at $SHA — skipping."
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Verify the tagged commit is on main
          if ! git merge-base --is-ancestor "$SHA" origin/main; then
            echo "::notice::Tag $TAG is not on main — skipping."
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Publishing $TAG ($SHA)"
          echo "should_publish=true" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  build:
    needs: [publish-gate]
    if: needs.publish-gate.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          checksum: ${{ env.UV_SHA256 }}

      - name: Set up Python from .python-version
        run: uv python install

      # The notes of the GitHub release: the version's section of the
      # changelog. Taken here, before anything is published, so that a version
      # without one stops the release before it reaches PyPI; and written
      # outside the checkout, so that the build sees the tagged commit only.
      - name: Write the release notes
        env:
          TAG: ${{ needs.publish-gate.outputs.tag }}
        run: uv run --no-project python scripts/release_notes.py "${TAG#v}" > "$RUNNER_TEMP/release-notes.md"

      - name: Build sdist and wheel
        run: uv build

      # Uploaded before the smoke test, the first step to run code of the
      # dependencies, so that what is published is what was built. The
      # publish job still waits for the test.
      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist
          path: dist/*

      - name: Upload the release notes
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: release-notes
          path: ${{ runner.temp }}/release-notes.md

      # Smoke-test the built wheel: install into a fresh venv and run the
      # CLI's --version. Catches anything missing from the wheel that's
      # needed for a working install (entry points, package data, etc.).
      # Its dependencies are the versions of uv.lock, which the tests ran on,
      # checked by their hashes: none is resolved afresh.
      - name: Verify wheel install
        run: |
          uv export --locked --no-default-groups --no-emit-project --output-file /tmp/requirements.txt
          uv venv /tmp/wheel-verify
          uv pip install --python /tmp/wheel-verify/bin/python --require-hashes -r /tmp/requirements.txt
          uv pip install --python /tmp/wheel-verify/bin/python --no-deps dist/licenseal-*.whl
          uv pip check --python /tmp/wheel-verify/bin/python
          /tmp/wheel-verify/bin/licenseal --version

  publish:
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pypi
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
        with:
          # A tag push and main push at the same SHA produce two CI runs and
          # thus two publish runs; the concurrency group cancels the duplicate,
          # but skip-existing makes a same-version re-upload a no-op rather than
          # a hard failure if the cancelled run already uploaded.
          skip-existing: true

  # The GitHub release of the tag, named after it, with the notes that the
  # build job wrote. This job holds the workflow's only token that can write
  # the repository, so it runs no code of the project or of its dependencies,
  # and checks nothing out: gh is the runner's own, and --verify-tag keeps it
  # from creating a tag. A release that exists, from a re-run, is left as it is.
  release:
    needs: [publish-gate, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write  # to create the GitHub release

    steps:
      - name: Download the release notes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: release-notes

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.publish-gate.outputs.tag }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "::notice::The release $TAG exists — skipping."
            exit 0
          fi
          gh release create "$TAG" --title "$TAG" --notes-file release-notes.md --verify-tag
