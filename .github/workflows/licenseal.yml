name: License compatibility

on:
  push:
    branches: [main, dev]
    tags: ["v*"]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

env:
  UV_VERSION: "0.11.19"

jobs:
  licenseal:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7
        with:
          version: ${{ env.UV_VERSION }}

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync

      # Real registry calls catch bugs that mocked tests can hide: response
      # shape regressions, threading/contextvar issues, and live I/O behavior.
      - name: licenseal check
        run: uv run licenseal check --no-dev

      - name: licenseal check --dev
        run: uv run licenseal check --dev
