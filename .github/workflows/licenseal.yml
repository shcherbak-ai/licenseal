name: License compatibility

on:
  push:
    branches: [main, dev]
    tags: ["v*"]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

env:
  UV_VERSION: "0.13.0"

jobs:
  licenseal:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}

      - name: Set up Python from .python-version
        run: uv python install

      - name: Install dependencies
        run: uv sync

      # Real registry calls catch bugs that mocked tests can hide: response
      # shape regressions, threading/contextvar issues, and live I/O behavior.
      - name: licenseal check
        run: uv run licenseal check --no-dev

      - name: licenseal check --dev
        run: uv run licenseal check --dev
