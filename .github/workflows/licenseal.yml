name: License compatibility

on:
  push:
    branches: [main, dev]
    tags: ["v*"]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

env:
  UV_VERSION: "0.13.6"

jobs:
  licenseal:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}

      - name: Set up Python from .python-version
        run: uv python install

      # --locked: fail when uv.lock does not match pyproject.toml.
      - name: Install dependencies
        run: uv sync --locked

      # Real registry calls catch bugs that mocked tests can hide: response
      # shape regressions, threading/contextvar issues, and live I/O behavior.
      - name: licenseal check
        run: uv run licenseal check --no-dev

      - name: licenseal check --dev
        run: uv run licenseal check --dev
